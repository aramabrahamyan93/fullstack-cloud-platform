namespace: fullstack-local

global:
  imageRegistry: ""

app:
  environment: local-k8s

database:
  mode: local

backend:
  replicas: 1

  waitForDatabase:
    enabled: true
    timeoutSeconds: 60

  config:
    sqlEcho: false
    dbInitRetries: 30
    dbInitRetryDelaySeconds: 1

  image:
    pullPolicy: Never

frontend:
  replicas: 1
  image:
    pullPolicy: Never

ingress:
  enabled: true
  host: localhost