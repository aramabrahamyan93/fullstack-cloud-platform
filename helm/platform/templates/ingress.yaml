{{- if .Values.ingress.enabled }}

{{- $defaultHost := ternary .Values.global.domain (printf "%s.%s" .Values.app.environment .Values.global.domain) (eq .Values.app.environment "prod") }}
{{- $host := default $defaultHost .Values.ingress.host }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: frontend-ingress
  namespace: {{ .Values.namespace }}

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    - host: {{ $host }}

      http:
        paths:
          - path: /
            pathType: Prefix

            backend:
              service:
                name: frontend
                port:
                  number: {{ .Values.frontend.port }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: backend-ingress
  namespace: {{ .Values.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    - host: {{ $host }}

      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific

            backend:
              service:
                name: backend
                port:
                  number: {{ .Values.backend.port }}

{{- end }}