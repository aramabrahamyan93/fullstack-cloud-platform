apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.frontend.replicas }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.frontend.strategy.maxUnavailable }}
      maxSurge: {{ .Values.frontend.strategy.maxSurge }}

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: "{{ include "platform.frontendImage" . }}"
          imagePullPolicy: "{{ .Values.frontend.image.pullPolicy }}"

          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}

          ports:
            - containerPort: {{ .Values.frontend.port }}

          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service

metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: frontend

spec:
  selector:
    app: frontend

  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}