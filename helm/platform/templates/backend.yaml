apiVersion: v1
kind: ConfigMap

metadata:
  name: backend-config
  namespace: {{ .Values.namespace }}

data:
  APP_ENV: {{ .Values.app.environment | quote }}
  APP_NAME: "{{ .Values.global.projectName }}-api"
  APP_VERSION: {{ .Values.app.version | quote }}

  {{- if eq .Values.database.mode "local" }}
  DATABASE_URL: "postgresql+psycopg://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@postgres:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}"
  {{- end }}

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: {{ .Values.namespace }}

spec:
  replicas: {{ .Values.backend.replicas }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.backend.strategy.maxUnavailable }}
      maxSurge: {{ .Values.backend.strategy.maxSurge }}

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      {{- $waitForDatabase := false }}
      {{- $waitTimeoutSeconds := 60 }}
      {{- with .Values.backend.waitForDatabase }}
      {{- $waitForDatabase = (.enabled | default false) }}
      {{- $waitTimeoutSeconds = (.timeoutSeconds | default 60) }}
      {{- end }}

      {{- if and (eq .Values.database.mode "local") $waitForDatabase }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: IfNotPresent

          envFrom:
            - secretRef:
                name: postgres-secret

          command:
            - sh
            - -c
            - |
              echo "Waiting for Postgres at postgres:{{ .Values.postgres.port }}..."

              for i in $(seq 1 {{ $waitTimeoutSeconds }}); do
                if pg_isready \
                  -h postgres \
                  -p {{ .Values.postgres.port }} \
                  -U "${POSTGRES_USER}" \
                  -d "${POSTGRES_DB}"; then
                  echo "Postgres is ready."
                  exit 0
                fi

                echo "Postgres is not ready yet. Attempt ${i}/{{ $waitTimeoutSeconds }}..."
                sleep 1
              done

              echo "ERROR: Postgres did not become ready in {{ $waitTimeoutSeconds }} seconds."
              exit 1
      {{- end }}

      containers:
        - name: backend
          image: "{{ include "platform.backendImage" . }}"
          imagePullPolicy: "{{ .Values.backend.image.pullPolicy }}"

          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

          ports:
            - containerPort: {{ .Values.backend.port }}

          envFrom:
            - configMapRef:
                name: backend-config

          {{- if eq .Values.database.mode "external" }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.urlKey }}
          {{- end }}

          startupProbe:
            httpGet:
              path: /health/live
              port: { { .Values.backend.port } }
            failureThreshold: 30
            periodSeconds: 5

            readinessProbe:
              httpGet:
                path: /health/ready
                port: { { .Values.backend.port } }
              initialDelaySeconds: 5
              periodSeconds: 5

            livenessProbe:
              httpGet:
                path: /health/live
                port: { { .Values.backend.port } }
              initialDelaySeconds: 15
              periodSeconds: 10

---
apiVersion: v1
kind: Service

metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    app: backend

spec:
  selector:
    app: backend

  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}