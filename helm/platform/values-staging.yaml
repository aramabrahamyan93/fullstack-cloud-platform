namespace: fullstack-staging

global:
  projectName: fullstack-cloud-platform
  awsAccountId: "859981975099"
  awsRegion: eu-central-1

app:
  environment: staging

database:
  mode: external
  secretName: backend-database-secret
  urlKey: DATABASE_URL

externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretStoreName: aws-secrets-manager
  remoteSecretName: fullstack-cloud-platform/staging/rds/postgres

backend:
  replicas: 2
  image:
    tag: staging-latest
    pullPolicy: IfNotPresent

frontend:
  replicas: 2
  image:
    tag: staging-latest
    pullPolicy: IfNotPresent

ingress:
  enabled: true
  host: staging.fullstack-cloud-platform.local