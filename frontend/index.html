<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fullstack Cloud Platform</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 32px;
      background: #f5f7fb;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Fullstack Cloud Platform</h1>

  <div class="card">
    <p><strong>API URL:</strong> <span id="apiUrl"></span></p>
    <p><strong>Backend Health:</strong> <span id="health">1loading...</span></p>
    <p><strong>Backend Version:</strong> <span id="version">1loading...</span></p>
  </div>

  <div class="card">
    <button onclick="createTask()">Create task</button>
  </div>

  <div class="card">
    <h2>Tasks</h2>
    <ul id="tasks"></ul>
  </div>

  <script>
    const API_BASE_URL = "/api";

    document.getElementById("apiUrl").innerText = API_BASE_URL;

    async function loadDashboard() {
      await fetchHealth();
      await fetchVersion();
      await fetchTasks();
    }

    async function fetchHealth() {
      const response = await fetch(`${API_BASE_URL}/health`);
      const data = await response.json();
      document.getElementById("health").innerText = data.status;
    }

    async function fetchVersion() {
      const response = await fetch(`${API_BASE_URL}/version`);
      const data = await response.json();
      document.getElementById("version").innerText = data.version;
    }

    async function fetchTasks() {
      const response = await fetch(`${API_BASE_URL}/tasks`);
      const tasks = await response.json();

      const list = document.getElementById("tasks");
      list.innerHTML = "";

      tasks.forEach((task) => {
        const item = document.createElement("li");
        item.innerText = `#${task.id} - ${task.title} (${task.status})`;
        list.appendChild(item);
      });
    }

    async function createTask() {
      await fetch(`${API_BASE_URL}/tasks`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          title: "Created from HTML frontend",
          status: "todo"
        })
      });

      await fetchTasks();
    }

    loadDashboard();
  </script>
</body>
</html>
