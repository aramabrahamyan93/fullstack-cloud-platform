name: Deploy Dev

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy. Leave empty to use current Git SHA."
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'fullstack-cloud-platform' }}
  ENVIRONMENT: dev
  ACCOUNT: dev-${{ vars.AWS_ACCOUNT_ID }}

jobs:
  deploy-dev:
    name: Deploy to dev EKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: image
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          else
            IMAGE_TAG="${GITHUB_SHA::7}"
          fi

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${IMAGE_TAG}"

      - name: Validate config
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "AWS_ACCOUNT_ID is empty. Set it in GitHub repository variables."
            exit 1
          fi

          echo "AWS_REGION=$AWS_REGION"
          echo "AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID"
          echo "PROJECT_NAME=$PROJECT_NAME"
          echo "ACCOUNT=$ACCOUNT"
          echo "IMAGE_TAG=${{ steps.image.outputs.image_tag }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$PROJECT_NAME-$ENVIRONMENT"

      - name: Install ingress-nginx
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx || true
          helm repo update

          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            -n ingress-nginx \
            --create-namespace

          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=600s

      - name: Install external-secrets with IRSA
        run: |
          EXTERNAL_SECRETS_ROLE_ARN="$(
            aws iam get-role \
              --role-name "$PROJECT_NAME-$ENVIRONMENT-external-secrets-role" \
              --query "Role.Arn" \
              --output text
          )"

          helm repo add external-secrets https://charts.external-secrets.io || true
          helm repo update

          helm upgrade --install external-secrets external-secrets/external-secrets \
            -n external-secrets \
            --create-namespace \
            --set installCRDs=true \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="$EXTERNAL_SECRETS_ROLE_ARN"

          kubectl wait --namespace external-secrets \
            --for=condition=ready pod \
            --all \
            --timeout=600s

      - name: Deploy Helm chart
        run: |
          helm upgrade --install "fullstack-$ENVIRONMENT" helm/platform \
            --namespace "fullstack-$ENVIRONMENT" \
            --create-namespace \
            -f "helm/platform/values-$ENVIRONMENT.yaml" \
            --set global.projectName="$PROJECT_NAME" \
            --set global.domain="$PROJECT_NAME.local" \
            --set global.awsAccountId="$AWS_ACCOUNT_ID" \
            --set global.awsRegion="$AWS_REGION" \
            --set backend.image.tag="${{ steps.image.outputs.image_tag }}" \
            --set frontend.image.tag="${{ steps.image.outputs.image_tag }}"

      - name: Wait for ExternalSecret
        run: |
          kubectl wait externalsecret backend-database-external-secret \
            -n "fullstack-$ENVIRONMENT" \
            --for=condition=Ready \
            --timeout=300s

      - name: Wait for deployments
        run: |
          kubectl rollout status deployment/frontend -n "fullstack-$ENVIRONMENT" --timeout=300s
          kubectl rollout status deployment/backend -n "fullstack-$ENVIRONMENT" --timeout=300s

      - name: Smoke test
        run: |
          LB_HOST="$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
          APP_HOST="$ENVIRONMENT.$PROJECT_NAME.local"

          echo "LB_HOST=$LB_HOST"
          echo "APP_HOST=$APP_HOST"

          curl -sS -f -H "Host: $APP_HOST" "http://$LB_HOST/" >/dev/null
          echo "Frontend OK"

          HEALTH_RESPONSE="$(curl -sS -f -H "Host: $APP_HOST" "http://$LB_HOST/api/health")"
          echo "$HEALTH_RESPONSE"

          echo "$HEALTH_RESPONSE" | grep -q '"status":"ok"'
          echo "Backend health OK"