name: Terraform CI

on:
  pull_request:
    branches:
      - main
      - develop
      - staging

  push:
    branches:
      - main
      - develop
      - staging

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_PROFILE_NAME: github-actions-ecr-role
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}

jobs:
  terraform-checks:
    name: Validate Terraform stacks
    runs-on: ubuntu-latest

    strategy:
      matrix:
        stack:
          - ecr
          - bootstrap
          - platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Terraform CLI.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Configure temporary AWS credentials using GitHub OIDC.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      # Check Terraform formatting.
      - name: Terraform format check
        run: terraform fmt -check -recursive infra

      - name: Validate Terraform backend config
        run: |
          if [ -z "$PROJECT_NAME" ]; then
            echo "PROJECT_NAME is empty"
            exit 1
          fi
          
          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "AWS_ACCOUNT_ID is empty"
            exit 1
          fi
          
          if [ -z "$AWS_REGION" ]; then
            echo "AWS_REGION is empty"
            exit 1
          fi
          
          echo "PROJECT_NAME=$PROJECT_NAME"
          echo "AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID"
          echo "AWS_REGION=$AWS_REGION"

      # Initialize stack.
      - name: Terraform init
        working-directory: infra/stacks/${{ matrix.stack }}
        run: |
          terraform init \
            -backend-config="bucket=${AWS_ACCOUNT_ID}-tf-state" \
            -backend-config="key=${PROJECT_NAME}/dev-${AWS_ACCOUNT_ID}/${{ matrix.stack }}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=terraform-locks" \
            -backend-config="encrypt=true"

      # Validate Terraform configuration.
      - name: Terraform validate
        working-directory: infra/stacks/${{ matrix.stack }}
        run: terraform validate

      # Generate a Terraform plan without applying changes.
      - name: Terraform plan
        working-directory: infra/stacks/${{ matrix.stack }}
        run: |
          terraform plan \
            -var-file=../../config/global.tfvars \
            -var-file=../../accounts/dev-${{ env.AWS_ACCOUNT_ID }}.tfvars