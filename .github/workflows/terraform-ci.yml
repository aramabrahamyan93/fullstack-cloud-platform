name: Terraform CI

on:
  pull_request:
    branches:
      - main
      - develop
      - staging
    paths:
      - infra/**
      - scripts/terraform.sh
      - scripts/bootstrap-terraform-state.sh
      - .github/workflows/terraform-ci.yml

  push:
    branches:
      - main
      - develop
      - staging
    paths:
      - infra/**
      - scripts/terraform.sh
      - scripts/bootstrap-terraform-state.sh
      - .github/workflows/terraform-ci.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'platform' }}
  ACCOUNT: dev-${{ vars.AWS_ACCOUNT_ID }}

jobs:
  prepare-stacks:
    name: Prepare Terraform stack matrix
    runs-on: ubuntu-latest

    outputs:
      stacks: ${{ steps.stacks.outputs.stacks }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load Terraform stacks
        id: stacks
        run: |
          STACKS=$(jq -c . infra/stacks/stacks.json)
          echo "stacks=$STACKS" >> "$GITHUB_OUTPUT"

  terraform-checks:
    name: Validate Terraform stack
    runs-on: ubuntu-latest
    needs: prepare-stacks

    strategy:
      matrix:
        stack: ${{ fromJson(needs.prepare-stacks.outputs.stacks) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-terraform-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform format check
        run: |
          ACTION=fmt \
          STACK=${{ matrix.stack }} \
          ACCOUNT=${ACCOUNT} \
          PROJECT_NAME=${PROJECT_NAME} \
          AWS_REGION=${AWS_REGION} \
          ACCOUNT_ID=${AWS_ACCOUNT_ID} \
          TF_LOCK=false \
          bash scripts/terraform.sh

      - name: Validate Terraform CI config
        run: |
          if [ -z "$PROJECT_NAME" ]; then
            echo "PROJECT_NAME is empty"
            exit 1
          fi

          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "AWS_ACCOUNT_ID is empty"
            exit 1
          fi

          if [ -z "$AWS_REGION" ]; then
            echo "AWS_REGION is empty"
            exit 1
          fi

          if [ ! -f "infra/accounts/${ACCOUNT}.tfvars" ]; then
            echo "Missing account config: infra/accounts/${ACCOUNT}.tfvars"
            exit 1
          fi

      - name: Terraform init
        run: |
          ACTION=init \
          STACK=${{ matrix.stack }} \
          ACCOUNT=${ACCOUNT} \
          PROJECT_NAME=${PROJECT_NAME} \
          AWS_REGION=${AWS_REGION} \
          ACCOUNT_ID=${AWS_ACCOUNT_ID} \
          TF_LOCK=false \
          bash scripts/terraform.sh

      - name: Terraform validate
        run: |
          ACTION=validate \
          STACK=${{ matrix.stack }} \
          ACCOUNT=${ACCOUNT} \
          PROJECT_NAME=${PROJECT_NAME} \
          AWS_REGION=${AWS_REGION} \
          ACCOUNT_ID=${AWS_ACCOUNT_ID} \
          TF_LOCK=false \
          bash scripts/terraform.sh

      - name: Terraform plan
        run: |
          ACTION=plan \
          STACK=${{ matrix.stack }} \
          ACCOUNT=${ACCOUNT} \
          PROJECT_NAME=${PROJECT_NAME} \
          AWS_REGION=${AWS_REGION} \
          ACCOUNT_ID=${AWS_ACCOUNT_ID} \
          TF_LOCK=false \
          bash scripts/terraform.sh