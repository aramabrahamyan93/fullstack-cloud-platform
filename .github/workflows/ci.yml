name: CI

on:
  pull_request:
    branches:
      - develop
      - main
      - master

  push:
    branches:
      - develop

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q

  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t fullstack-cloud-platform-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t fullstack-cloud-platform-frontend:ci ./frontend

  helm:
    name: Helm template validation
    runs-on: ubuntu-latest

    strategy:
      matrix:
        env: [dev, staging, prod]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Render Helm chart
        run: |
          helm template fullstack-${{ matrix.env }} helm/platform \
            --namespace fullstack-${{ matrix.env }} \
            -f helm/platform/values-${{ matrix.env }}.yaml \
            --set global.projectName=fullstack-cloud-platform \
            --set global.domain=fullstack-cloud-platform.local \
            --set global.awsAccountId=000000000000 \
            --set global.awsRegion=eu-central-1

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/stacks/platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"

      - name: Terraform fmt
        run: terraform fmt -check -recursive ../..

      - name: Terraform init without backend
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate