name: Auto Deploy Dev

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: auto-deploy-dev
  cancel-in-progress: true

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Disabled
        run: |
          echo "Auto deploy is disabled."
          echo "Deployment is now handled by ArgoCD GitOps."