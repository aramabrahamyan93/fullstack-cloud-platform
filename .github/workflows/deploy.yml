name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

      image_tag:
        description: "Image tag to deploy. Leave empty to use current Git SHA."
        required: false
        default: ""

  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'fullstack-cloud-platform' }}
  RELEASE_PREFIX: ${{ vars.RELEASE_PREFIX || 'fullstack' }}

concurrency:
  group: deploy-${{ github.event.inputs.environment || inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve deploy context
        id: context
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
            INPUT_IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          else
            ENVIRONMENT="${{ inputs.environment }}"
            INPUT_IMAGE_TAG="${{ inputs.image_tag }}"
          fi

          if [ -z "$ENVIRONMENT" ]; then
            echo "ENVIRONMENT is empty"
            exit 1
          fi

          if [ -n "$INPUT_IMAGE_TAG" ]; then
            IMAGE_TAG="$INPUT_IMAGE_TAG"
          else
            IMAGE_TAG="${GITHUB_SHA::7}"
          fi

          ACCOUNT="${ENVIRONMENT}-${AWS_ACCOUNT_ID}"
          CLUSTER_NAME="${PROJECT_NAME}-${ENVIRONMENT}"
          NAMESPACE="${RELEASE_PREFIX}-${ENVIRONMENT}"
          HELM_RELEASE="${RELEASE_PREFIX}-${ENVIRONMENT}"
          APP_HOST="${ENVIRONMENT}.${PROJECT_NAME}.local"
          EXTERNAL_SECRETS_ROLE_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:role/${PROJECT_NAME}-${ENVIRONMENT}-external-secrets-role"

          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "account=${ACCOUNT}" >> "$GITHUB_OUTPUT"
          echo "cluster_name=${CLUSTER_NAME}" >> "$GITHUB_OUTPUT"
          echo "namespace=${NAMESPACE}" >> "$GITHUB_OUTPUT"
          echo "helm_release=${HELM_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "app_host=${APP_HOST}" >> "$GITHUB_OUTPUT"
          echo "external_secrets_role_arn=${EXTERNAL_SECRETS_ROLE_ARN}" >> "$GITHUB_OUTPUT"

          echo "ENVIRONMENT=${ENVIRONMENT}"
          echo "IMAGE_TAG=${IMAGE_TAG}"
          echo "ACCOUNT=${ACCOUNT}"
          echo "CLUSTER_NAME=${CLUSTER_NAME}"
          echo "NAMESPACE=${NAMESPACE}"
          echo "HELM_RELEASE=${HELM_RELEASE}"
          echo "APP_HOST=${APP_HOST}"
          echo "EXTERNAL_SECRETS_ROLE_ARN=${EXTERNAL_SECRETS_ROLE_ARN}"
      - name: Validate config
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "AWS_ACCOUNT_ID is empty. Set it in GitHub repository variables."
            exit 1
          fi

          if [ -z "$PROJECT_NAME" ]; then
            echo "PROJECT_NAME is empty."
            exit 1
          fi

          if [ ! -f "helm/platform/values-${{ steps.context.outputs.environment }}.yaml" ]; then
            echo "Missing Helm values file: helm/platform/values-${{ steps.context.outputs.environment }}.yaml"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "${{ steps.context.outputs.cluster_name }}"

      - name: Install ingress-nginx
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx || true
          helm repo update

          kubectl delete job ingress-nginx-admission-create -n ingress-nginx --ignore-not-found=true
          kubectl delete job ingress-nginx-admission-patch -n ingress-nginx --ignore-not-found=true

          helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
            -n ingress-nginx \
            --create-namespace \
            --wait \
            --timeout 10m

          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=600s

      - name: Install external-secrets with IRSA
        run: |
          helm repo add external-secrets https://charts.external-secrets.io || true
          helm repo update

          helm upgrade --install external-secrets external-secrets/external-secrets \
            -n external-secrets \
            --create-namespace \
            --set installCRDs=true \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="${{ steps.context.outputs.external_secrets_role_arn }}"

          kubectl wait --namespace external-secrets \
            --for=condition=ready pod \
            --all \
            --timeout=600s

      - name: Delete old ClusterSecretStore
        run: |
          kubectl delete clustersecretstore aws-secrets-manager --ignore-not-found=true

      - name: Deploy Helm chart
        run: |
          ENVIRONMENT="${{ steps.context.outputs.environment }}"

          helm upgrade --install "${{ steps.context.outputs.helm_release }}" helm/platform \
            --namespace "${{ steps.context.outputs.namespace }}" \
            --create-namespace \
            -f "helm/platform/values-${ENVIRONMENT}.yaml" \
            --set namespace="${{ steps.context.outputs.namespace }}" \
            --set global.projectName="$PROJECT_NAME" \
            --set global.domain="$PROJECT_NAME.local" \
            --set global.awsAccountId="$AWS_ACCOUNT_ID" \
            --set global.awsRegion="$AWS_REGION" \
            --set backend.image.tag="${{ steps.context.outputs.image_tag }}" \
            --set frontend.image.tag="${{ steps.context.outputs.image_tag }}"

      - name: Wait for ExternalSecret
        run: |
          kubectl wait externalsecret backend-database-external-secret \
            -n "${{ steps.context.outputs.namespace }}" \
            --for=condition=Ready \
            --timeout=300s

      - name: Wait for deployments
        run: |
          kubectl rollout status deployment/frontend \
            -n "${{ steps.context.outputs.namespace }}" \
            --timeout=300s

          kubectl rollout status deployment/backend \
            -n "${{ steps.context.outputs.namespace }}" \
            --timeout=300s

      - name: Smoke test
        run: |
          LB_HOST="$(kubectl get svc ingress-nginx-controller -n ingress-nginx -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
          APP_HOST="${{ steps.context.outputs.app_host }}"
          
          echo "LB_HOST=$LB_HOST"
          echo "APP_HOST=$APP_HOST"
          
          for i in {1..30}; do
            if curl -sS -f -H "Host: $APP_HOST" "http://$LB_HOST/" >/dev/null; then
              echo "Frontend OK"
              break
            fi
          
            echo "Frontend not ready yet. Retry $i/30..."
            sleep 10
          done
          
          for i in {1..30}; do
            HEALTH_RESPONSE="$(curl -sS -f -H "Host: $APP_HOST" "http://$LB_HOST/api/health" || true)"
            echo "$HEALTH_RESPONSE"
          
            if echo "$HEALTH_RESPONSE" | grep -q '"status":"ok"'; then
              echo "Backend health OK"
              exit 0
            fi
          
            echo "Backend not ready yet. Retry $i/30..."
            sleep 10
          done
          
          echo "Backend health check failed"
          exit 1