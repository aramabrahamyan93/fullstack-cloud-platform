name: Docker Build and Push

on:
  push:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME || 'fullstack-cloud-platform' }}
  ACCOUNT: dev-${{ vars.AWS_ACCOUNT_ID }}

jobs:
  docker-build-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate config
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "AWS_ACCOUNT_ID is empty. Set it in GitHub repository variables."
            exit 1
          fi

          echo "AWS_REGION=$AWS_REGION"
          echo "AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID"
          echo "PROJECT_NAME=$PROJECT_NAME"
          echo "ACCOUNT=$ACCOUNT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and push images
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"

          ACCOUNT="${ACCOUNT}" \
          AWS_REGION="${AWS_REGION}" \
          PROJECT_NAME="${PROJECT_NAME}" \
          IMAGE_TAG="${IMAGE_TAG}" \
          bash scripts/docker-build-push.sh

      - name: Print image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}"