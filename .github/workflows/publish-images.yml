name: Publish Images to ECR

on:
  push:
    branches:
      - develop
      - staging
      - main
    paths:
      - backend/**
      - frontend/**
      - services.json
      - helm/platform/values-dev.yaml
      - .github/workflows/publish-images.yml

permissions:
  id-token: write
  contents: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_ROLE_NAME: github-actions-ecr-role

jobs:
  prepare-services:
    name: Prepare changed service matrix
    runs-on: ubuntu-latest

    outputs:
      services: ${{ steps.changed-services.outputs.services }}
      deploy_env: ${{ steps.env.outputs.deploy_env }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve deployment environment
        id: env
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "deploy_env=prod" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "staging" ]; then
            echo "deploy_env=staging" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_env=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed services
        id: changed-services
        run: |
          BEFORE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"

          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA="$(git rev-parse HEAD~1)"
          fi

          echo "Comparing $BEFORE_SHA..$HEAD_SHA"

          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          before = os.environ["BEFORE_SHA"]
          head = os.environ["HEAD_SHA"]

          changed_files = subprocess.check_output(
              ["git", "diff", "--name-only", before, head],
              text=True,
          ).splitlines()

          services = json.loads(Path("services.json").read_text())

          build_all = (
              "services.json" in changed_files
              or ".github/workflows/publish-images.yml" in changed_files
          )

          selected = []
          for service in services:
              context = service["context"].lstrip("./").rstrip("/")
              if build_all or any(path == context or path.startswith(context + "/") for path in changed_files):
                  selected.append(service)

          print("Changed files:")
          for path in changed_files:
              print(f" - {path}")

          print("Selected services:")
          for service in selected:
              print(f" - {service['name']}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"services={json.dumps(selected, separators=(',', ':'))}\n")
          PY

  publish-images:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: prepare-services

    if: needs.prepare-services.outputs.services != '[]'

    environment:
      name: ${{ needs.prepare-services.outputs.deploy_env }}

    strategy:
      matrix:
        service: ${{ fromJson(needs.prepare-services.outputs.services) }}

    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate AWS configuration
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then
            echo "AWS_ACCOUNT_ID is not set"
            exit 1
          fi

          if [ -z "$AWS_REGION" ]; then
            echo "AWS_REGION is not set"
            exit 1
          fi

          if [ -z "$PROJECT_NAME" ]; then
            echo "PROJECT_NAME is not set"
            exit 1
          fi

          echo "Deploy environment: ${{ needs.prepare-services.outputs.deploy_env }}"
          echo "AWS account: $AWS_ACCOUNT_ID"
          echo "AWS region: $AWS_REGION"
          echo "Project name: $PROJECT_NAME"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.AWS_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "BRANCH_TAG=${GITHUB_REF_NAME}-latest" >> "$GITHUB_ENV"

      - name: Build and push ${{ matrix.service.name }} image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SERVICE_NAME: ${{ matrix.service.name }}
          SERVICE_CONTEXT: ${{ matrix.service.context }}

        run: |
          REPOSITORY_NAME="${PROJECT_NAME}-${SERVICE_NAME}"

          docker build \
            -t "$ECR_REGISTRY/$REPOSITORY_NAME:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$REPOSITORY_NAME:$BRANCH_TAG" \
            "$SERVICE_CONTEXT"

          docker push "$ECR_REGISTRY/$REPOSITORY_NAME:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$REPOSITORY_NAME:$BRANCH_TAG"

  update-dev-image-tags:
    name: Update dev image tags
    runs-on: ubuntu-latest
    needs:
      - prepare-services
      - publish-images

    if: github.ref_name == 'develop' && needs.prepare-services.outputs.services != '[]' && !contains(github.event.head_commit.message, '[skip image-update]')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Update Helm dev image tags
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          export IMAGE_TAG

          cat > /tmp/services.json <<'JSON'
          ${{ needs.prepare-services.outputs.services }}
          JSON

          for service in $(jq -r '.[].name' /tmp/services.json); do
            echo "Updating ${service}.image.tag to ${IMAGE_TAG}"
            yq -i ".${service}.image.tag = strenv(IMAGE_TAG)" helm/platform/values-dev.yaml
          done

          git diff

      - name: Commit image tag update
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No image tag changes."
            exit 0
          fi

          git add helm/platform/values-dev.yaml
          git commit -m "Update dev image tags to ${IMAGE_TAG} [skip image-update]"
          git push origin develop