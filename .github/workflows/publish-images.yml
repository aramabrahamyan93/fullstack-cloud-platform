name: Publish Images to ECR

on:
  push:
    branches:
      - develop
      - staging
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}

jobs:
  publish-images:
    name: Build and push Docker images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Use GitHub OIDC to assume an AWS IAM role without static AWS keys.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Authenticate Docker against Amazon ECR.
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Create immutable and branch-based tags.
      # Example:
      #   5eff799
      #   develop-latest
      - name: Set image tags
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "BRANCH_TAG=${GITHUB_REF_NAME}-latest" >> $GITHUB_ENV

      # Build and push each service image.
      # New services can be added by extending the matrix above.
      - name: Build and push ${{ matrix.service.name }} image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SERVICE_NAME: ${{ matrix.service.name }}
          SERVICE_CONTEXT: ${{ matrix.service.context }}

        run: |
          REPOSITORY_NAME="${PROJECT_NAME}-${SERVICE_NAME}"

          docker build \
            -t "$ECR_REGISTRY/$REPOSITORY_NAME:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$REPOSITORY_NAME:$BRANCH_TAG" \
            "$SERVICE_CONTEXT"

          docker push "$ECR_REGISTRY/$REPOSITORY_NAME:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$REPOSITORY_NAME:$BRANCH_TAG"