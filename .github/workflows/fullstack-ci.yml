name: Fullstack CI

on:
  pull_request:
    branches:
      - main
      - develop
      - staging
    paths:
      - services/backend/**
      - apps/frontend/**
      - helm/**
      - scripts/validate-services.py
      - scripts/docker-build-push.sh
      - scripts/compose.sh
      - docker-compose.yml
      - docker-compose.yaml
      - Makefile
      - services.json
      - project.env
      - .github/workflows/fullstack-ci.yml

  push:
    branches:
      - main
      - develop
      - staging
    paths:
      - services/backend/**
      - apps/frontend/**
      - helm/**
      - scripts/validate-services.py
      - scripts/docker-build-push.sh
      - scripts/compose.sh
      - docker-compose.yml
      - docker-compose.yaml
      - Makefile
      - services.json
      - project.env
      - .github/workflows/fullstack-ci.yml

permissions:
  contents: read

concurrency:
  group: fullstack-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fullstack-checks:
    name: Build and test fullstack app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate service registry
        run: make validate-services

      - name: Validate Docker Compose wrapper syntax
        run: bash -n scripts/compose.sh

      - name: Validate Docker build push script syntax
        run: bash -n scripts/docker-build-push.sh

      - name: Validate registry-based Docker build push dry run
        run: |
          DRY_RUN=true \
          ACCOUNT=dev-000000000000 \
          bash scripts/docker-build-push.sh

      - name: Validate Docker Compose config
        run: bash scripts/compose.sh config

      - name: Build backend Docker image
        run: bash scripts/compose.sh build backend

      - name: Run backend tests
        run: bash scripts/compose.sh run --rm backend pytest

      - name: Build frontend Docker image
        run: bash scripts/compose.sh build frontend

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: make helm-lint

      - name: Render Helm chart for local
        run: make helm-render ENV=local PROJECT_NAME=${{ vars.PROJECT_NAME }}

      - name: Render Helm chart for dev
        run: make helm-render ENV=dev PROJECT_NAME=${{ vars.PROJECT_NAME }} AWS_ACCOUNT_ID=${{ vars.AWS_ACCOUNT_ID }} AWS_REGION=${{ vars.AWS_REGION }}

      - name: Render Helm chart for staging
        run: make helm-render ENV=staging PROJECT_NAME=${{ vars.PROJECT_NAME }} AWS_ACCOUNT_ID=${{ vars.AWS_ACCOUNT_ID }} AWS_REGION=${{ vars.AWS_REGION }}

      - name: Render Helm chart for prod
        run: make helm-render ENV=prod PROJECT_NAME=${{ vars.PROJECT_NAME }} AWS_ACCOUNT_ID=${{ vars.AWS_ACCOUNT_ID }} AWS_REGION=${{ vars.AWS_REGION }}

      - name: Start full stack
        run: bash scripts/compose.sh up -d

      - name: Show containers
        run: bash scripts/compose.sh ps

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8000/health; then
              echo "Backend is healthy"
              exit 0
            fi

            echo "Waiting for backend..."
            bash scripts/compose.sh ps
            sleep 3
          done

          echo "Backend did not become healthy"
          bash scripts/compose.sh logs backend
          exit 1

      - name: Wait for frontend
        run: |
          for i in {1..20}; do
            if curl --fail http://localhost:3000; then
              echo "Frontend is reachable"
              exit 0
            fi

            echo "Waiting for frontend..."
            bash scripts/compose.sh ps
            sleep 3
          done

          echo "Frontend did not become reachable"
          bash scripts/compose.sh logs frontend
          exit 1

      - name: Show logs on failure
        if: failure()
        run: bash scripts/compose.sh logs

      - name: Cleanup
        if: always()
        run: bash scripts/compose.sh down -v