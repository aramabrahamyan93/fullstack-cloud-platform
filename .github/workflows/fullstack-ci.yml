name: Fullstack CI

on:
  pull_request:
    branches:
      - main
      - develop
      - staging

  push:
    branches:
      - main
      - develop
      - staging

permissions:
  contents: read

jobs:
  fullstack-checks:
    name: Build and test fullstack app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Validate Docker Compose file syntax before building services.
      - name: Validate Docker Compose config
        run: docker compose config

      - name: Build backend Docker image
        run: docker compose build backend

      - name: Run backend tests
        run: docker compose run --rm backend pytest

      - name: Build frontend Docker image
        run: docker compose build frontend

      # Install Helm CLI so Kubernetes templates can be validated in CI.
      - name: Install Helm
        uses: azure/setup-helm@v4

      # Validate Helm chart structure and template syntax.
      - name: Lint Helm chart
        run: make helm-lint

      # Render local values without AWS settings because local kind uses locally loaded images.
      - name: Render Helm chart for local
        run: make helm-render ENV=local PROJECT_NAME=${{ vars.PROJECT_NAME }}

      # Render cloud-like environments with AWS/ECR settings.
      - name: Render Helm chart for dev
        run: make helm-render ENV=dev PROJECT_NAME=${{ vars.PROJECT_NAME }} AWS_ACCOUNT_ID=${{ vars.AWS_ACCOUNT_ID }} AWS_REGION=${{ vars.AWS_REGION }}

      - name: Render Helm chart for staging
        run: make helm-render ENV=staging PROJECT_NAME=${{ vars.PROJECT_NAME }} AWS_ACCOUNT_ID=${{ vars.AWS_ACCOUNT_ID }} AWS_REGION=${{ vars.AWS_REGION }}

      - name: Render Helm chart for prod
        run: make helm-render ENV=prod PROJECT_NAME=${{ vars.PROJECT_NAME }} AWS_ACCOUNT_ID=${{ vars.AWS_ACCOUNT_ID }} AWS_REGION=${{ vars.AWS_REGION }}

      # Start the full local stack for smoke testing.
      - name: Start full stack
        run: docker compose up -d

      - name: Show containers
        run: docker compose ps

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8000/health; then
              echo "Backend is healthy"
              exit 0
            fi

            echo "Waiting for backend..."
            docker compose ps
            sleep 3
          done

          echo "Backend did not become healthy"
          docker compose logs backend
          exit 1

      - name: Wait for frontend
        run: |
          for i in {1..20}; do
            if curl --fail http://localhost:3000; then
              echo "Frontend is reachable"
              exit 0
            fi

            echo "Waiting for frontend..."
            docker compose ps
            sleep 3
          done

          echo "Frontend did not become reachable"
          docker compose logs frontend
          exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v