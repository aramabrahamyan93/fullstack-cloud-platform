services:
  backend:
    image: "${PROJECT_NAME}-backend:latest"
    build:
      context: ./services/backend
    env_file:
      - .env.local
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    image: "${PROJECT_NAME}-frontend:latest"
    build:
      context: ./apps/frontend
      args:
        VITE_APP_TITLE: "${FRONTEND_APP_TITLE}"
        VITE_API_BASE_URL: "${FRONTEND_API_BASE_URL}"
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

  postgres:
    image: postgres:16
    env_file:
      - .env.local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge