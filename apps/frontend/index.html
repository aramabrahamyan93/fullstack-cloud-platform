<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fullstack Cloud Platform</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 32px;
      background: #f5f7fb;
      color: #1f2937;
    }

    h1 {
      margin-bottom: 24px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .form-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    input,
    select {
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      min-width: 180px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-weight: 600;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .muted {
      color: #6b7280;
    }

    .error {
      color: #b91c1c;
      font-weight: 600;
    }

    .success {
      color: #047857;
      font-weight: 600;
    }

    li {
      margin-bottom: 8px;
    }
  </style>
</head>

<body>
  <h1>Fullstack Cloud Platform</h1>

  <div class="card">
    <p><strong>API URL:</strong> <span id="apiUrl"></span></p>
    <p><strong>Backend Health:</strong> <span id="health">loading...</span></p>
    <p><strong>Backend Version:</strong> <span id="version">loading...</span></p>
  </div>

  <div class="card">
    <h2>Create Task</h2>

    <div class="form-row">
      <input
        id="taskTitle"
        type="text"
        maxlength="200"
        placeholder="Task title"
        value="Created from HTML frontend"
      />

      <select id="taskStatus">
        <option value="open">open</option>
        <option value="in_progress">in_progress</option>
        <option value="done">done</option>
      </select>

      <button id="createButton" onclick="createTask()">Create task</button>
    </div>

    <p id="message" class="muted"></p>
  </div>

  <div class="card">
    <h2>Tasks</h2>
    <p id="tasksLoading" class="muted">Loading tasks...</p>
    <ul id="tasks"></ul>
  </div>

  <script>
    const API_BASE_URL = "/api";

    document.getElementById("apiUrl").innerText = API_BASE_URL;

    async function loadDashboard() {
      await fetchHealth();
      await fetchVersion();
      await fetchTasks();
    }

    async function fetchJson(url, options = {}) {
      const response = await fetch(url, options);

      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(`Request failed with status ${response.status}: ${errorText}`);
      }

      return response.json();
    }

    async function fetchHealth() {
      try {
        const data = await fetchJson(`${API_BASE_URL}/health`);
        document.getElementById("health").innerText = data.status;
      } catch (error) {
        document.getElementById("health").innerText = "error";
        showMessage(error.message, "error");
      }
    }

    async function fetchVersion() {
      try {
        const data = await fetchJson(`${API_BASE_URL}/version`);
        document.getElementById("version").innerText = data.version;
      } catch (error) {
        document.getElementById("version").innerText = "error";
        showMessage(error.message, "error");
      }
    }

    async function fetchTasks() {
      const loading = document.getElementById("tasksLoading");
      const list = document.getElementById("tasks");

      loading.style.display = "block";
      list.innerHTML = "";

      try {
        const tasks = await fetchJson(`${API_BASE_URL}/tasks`);

        if (tasks.length === 0) {
          loading.innerText = "No tasks yet.";
          return;
        }

        loading.style.display = "none";

        tasks.forEach((task) => {
          const item = document.createElement("li");
          item.innerText = `#${task.id} - ${task.title} (${task.status})`;
          list.appendChild(item);
        });
      } catch (error) {
        loading.innerText = "Failed to load tasks.";
        showMessage(error.message, "error");
      }
    }

    async function createTask() {
      const button = document.getElementById("createButton");
      const titleInput = document.getElementById("taskTitle");
      const statusSelect = document.getElementById("taskStatus");

      const title = titleInput.value.trim();
      const status = statusSelect.value;

      if (!title) {
        showMessage("Task title is required.", "error");
        return;
      }

      button.disabled = true;
      showMessage("Creating task...", "muted");

      try {
        await fetchJson(`${API_BASE_URL}/tasks`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            title,
            status
          })
        });

        titleInput.value = "";
        showMessage("Task created successfully.", "success");
        await fetchTasks();
      } catch (error) {
        showMessage(error.message, "error");
      } finally {
        button.disabled = false;
      }
    }

    function showMessage(message, type) {
      const messageElement = document.getElementById("message");
      messageElement.innerText = message;
      messageElement.className = type;
    }

    loadDashboard();
  </script>
</body>
</html>
